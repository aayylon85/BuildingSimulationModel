<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#F5F5F7"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E5EA" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <g id="laptop">
      <rect x="0" y="0" width="36" height="24" fill="#CBD5E1" rx="3"/>
      <rect x="4" y="10" width="28" height="10" fill="#94A3B8" rx="1"/>
      <path d="M 12 21 L 24 21" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="desk-light">
      <circle cx="0" cy="0" r="10" fill="#FEF08A" stroke="#FDE047" stroke-width="1"/>
      <path d="M -10 0 A 10 10 0 0 1 10 0" fill="#EAB308"/>
    </g>
    <g id="ceiling-light">
      <circle cx="0" cy="0" r="18" fill="#FEF08A" stroke="#FDE047" stroke-width="2" opacity="0.6"/>
      <circle cx="0" cy="0" r="6" fill="#EAB308"/>
    </g>
  </defs>
  
  <rect width="1200" height="800" fill="url(#grid)" />

  <rect x="55" y="55" width="1090" height="690" fill="none" stroke="#1E293B" stroke-width="6"/>
  
  <line x1="200" y1="745" x2="400" y2="745" stroke="#60A5FA" stroke-width="6"/>
  <line x1="600" y1="745" x2="900" y2="745" stroke="#60A5FA" stroke-width="6"/>
  <text x="650" y="770" font-family="Inter, sans-serif" fill="#60A5FA" font-size="10" font-weight="bold">SOUTH WINDOWS</text>

  <rect x="750" y="60" width="390" height="300" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="2"/>
  <text x="770" y="90" font-family="Inter, sans-serif" font-weight="800" fill="#16A34A" font-size="20" letter-spacing="1">MEETING ROOM</text>
  
  <g transform="translate(950, 100)">
    <use href="#ceiling-light"/>
    <text y="30" text-anchor="middle" font-family="Inter" font-size="8" font-weight="bold" fill="#9CA3AF">MEETING LIGHT</text>
  </g>

  <rect x="850" y="150" width="200" height="100" rx="20" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2" filter="url(#shadow)"/>
  
  <rect x="920" y="160" width="60" height="10" fill="#333" rx="2"/> 
  <text x="925" y="155" font-family="Inter, sans-serif" fill="#9CA3AF" font-size="9" font-weight="bold">PROJECTOR</text>
  
  <circle cx="950" cy="200" r="8" fill="#4B5563"/> 
  <text x="965" y="203" font-family="Inter, sans-serif" fill="#9CA3AF" font-size="9" font-weight="bold">CONF. PHONE</text>

  <circle cx="880" cy="120" r="15" fill="#16A34A" opacity="0.3"/> <circle cx="950" cy="120" r="15" fill="#16A34A" opacity="0.3"/> <circle cx="1020" cy="120" r="15" fill="#16A34A" opacity="0.3"/>
  <circle cx="880" cy="280" r="15" fill="#16A34A" opacity="0.3"/> <circle cx="950" cy="280" r="15" fill="#16A34A" opacity="0.3"/> <circle cx="1020" cy="280" r="15" fill="#16A34A" opacity="0.3"/>

  <g transform="translate(600, 300)">
    <use href="#ceiling-light"/>
    <text y="30" text-anchor="middle" font-family="Inter" font-size="8" font-weight="bold" fill="#9CA3AF">ZONE_MAIN LIGHT</text>
  </g>

  <rect x="60" y="350" width="390" height="390" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="2"/>
  <text x="75" y="380" font-family="Inter, sans-serif" fill="#EA580C" font-size="20" font-weight="800">BREAK AREA</text>

  <rect x="60" y="420" width="45" height="310" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  
  <g transform="translate(60, 430)"> 
    <rect x="0" y="0" width="45" height="50" fill="#E2E8F0"/>
    <rect x="35" y="5" width="4" height="30" fill="#94A3B8" rx="2"/>
  </g>
  <text x="115" y="460" font-family="Inter, sans-serif" fill="#94A3B8" font-size="9" font-weight="bold">FRIDGE</text>

  <g transform="translate(60, 490)">
    <rect x="0" y="0" width="45" height="40" fill="#E2E8F0"/>
    <circle cx="22" cy="20" r="12" fill="#CBD5E1"/>
  </g>
  <text x="115" y="515" font-family="Inter, sans-serif" fill="#94A3B8" font-size="9" font-weight="bold">SINK</text>

  <g transform="translate(65, 550)"> 
    <rect x="0" y="0" width="30" height="30" fill="#1F293B" rx="4"/>
    <circle cx="15" cy="10" r="3" fill="#EF4444"/>
  </g>
  <text x="115" y="570" font-family="Inter, sans-serif" fill="#94A3B8" font-size="9" font-weight="bold">COFFEE M.</text>

  <g transform="translate(65, 610)">
    <rect x="5" y="5" width="20" height="20" fill="#CBD5E1" rx="8"/>
    <path d="M 25 15 L 30 10 L 25 20" stroke="#CBD5E1" stroke-width="2" fill="none"/>
  </g>
  <text x="115" y="625" font-family="Inter, sans-serif" fill="#94A3B8" font-size="9" font-weight="bold">KETTLE</text>

  <g transform="translate(65, 670)">
    <rect x="0" y="0" width="35" height="25" fill="#334155" rx="3"/>
    <rect x="25" y="5" width="5" height="15" fill="#94A3B8"/>
  </g>
  <text x="115" y="685" font-family="Inter, sans-serif" fill="#94A3B8" font-size="9" font-weight="bold">MICROWAVE</text>

  <g transform="translate(250, 550)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="#FED7AA" stroke-width="4"/>
    <circle cx="-70" cy="0" r="20" fill="#FDBA74"/> <circle cx="70" cy="0" r="20" fill="#FDBA74"/>
    <circle cx="0" cy="-70" r="20" fill="#FDBA74"/> <circle cx="0" cy="70" r="20" fill="#FDBA74"/>
  </g>

  <g transform="translate(350, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="10" y="70" font-family="Inter, sans-serif" fill="#94A3B8" font-size="14" font-weight="bold">DESK C</text>
    
    <rect x="40" y="15" width="60" height="8" fill="#333" rx="2"/> <use href="#laptop" x="52" y="30"/> <use href="#desk-light" x="115" y="25"/> </g>

  <g transform="translate(600, 600)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="10" y="70" font-family="Inter, sans-serif" fill="#94A3B8" font-size="14" font-weight="bold">DESK A</text>
    
    <rect x="40" y="15" width="60" height="8" fill="#333" rx="2"/> <use href="#laptop" x="52" y="30"/> <use href="#desk-light" x="115" y="25"/> </g>

  <g transform="translate(1000, 600)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="10" y="70" font-family="Inter, sans-serif" fill="#94A3B8" font-size="14" font-weight="bold">DESK B</text>
    
    <rect x="40" y="15" width="60" height="8" fill="#333" rx="2"/> <use href="#laptop" x="52" y="30"/> <use href="#desk-light" x="115" y="25"/> </g>

  <g transform="translate(1050, 500)" filter="url(#shadow)">
    <rect x="0" y="0" width="60" height="60" fill="#CBD5E1" rx="4"/>
    <rect x="10" y="10" width="40" height="5" fill="#333"/>
    <rect x="40" y="40" width="10" height="10" fill="#22C55E"/>
  </g>
  <text x="1055" y="490" font-family="Inter, sans-serif" fill="#64748B" font-size="10" font-weight="bold">PHOTOCOPIER</text>

  <path d="M 450 745 L 550 745" stroke="#F5F5F7" stroke-width="10"/>
  <path d="M 450 745 L 450 665" stroke="#333" stroke-width="4" stroke-dasharray="10,5"/>
  <text x="460" y="730" font-family="Inter, sans-serif" fill="#94A3B8" font-size="10" font-weight="bold">ENTRANCE</text>

</svg>